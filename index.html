const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const go=document.getElementById('go'), err=document.getElementById('err'), inp=document.getElementById('pw');
  go.disabled=true; err.textContent='';
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(inp.value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c)));
    document.open(); document.write(html); document.close();
  }catch(x){
    err.textContent='Λάθος κωδικός'; inp.value=''; inp.focus();
    const f=document.getElementById('f'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    go.disabled=false;
  }
});
